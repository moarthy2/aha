name: Minecraft Server

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mc-server
  cancel-in-progress: false

env:
  TAG: world-data
  ARCHIVE: world.tar.zst
  GH_REPO: ${{ github.repository }}

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ vars.JAVA_VERSION || '25' }}

      - name: Restore data
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern "$ARCHIVE" --dir .
            tar --zstd -xf "$ARCHIVE" -C data
            rm -f "$ARCHIVE"
            echo "Data restored"
          else
            echo "No saved data yet, starting fresh"
          fi

      - name: Prepare server
        env:
          JAR_URL: ${{ vars.SERVER_JAR_URL }}
        run: |
          curl -fsSL -o server.jar "$JAR_URL"
          if [ -d server ]; then cp -r server/. data/; fi
          echo "eula=true" > data/eula.txt

      - name: Start playit tunnel
        env:
          SECRET_KEY: ${{ secrets.PLAYIT_SECRET }}
        run: |
          docker run -d --name playit --net=host \
            -e SECRET_KEY="$SECRET_KEY" \
            ghcr.io/playit-cloud/playit-agent:1.0

      - name: Run server
        id: srv
        working-directory: data
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SERVER_ADDRESS: ${{ vars.SERVER_ADDRESS || 'dedication-octet.tun.ply.gg' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          STATUS_INTERVAL: ${{ vars.STATUS_INTERVAL || '10' }}
          LIMIT_MIN: '335'
          LOG: server.log
        run: |
          start=$(date +%s)
          bash ../scripts/status.sh run >/dev/null 2>&1 &
          MON=$!
          timeout -s TERM 335m java -Xms8G -Xmx10G -jar ../server.jar nogui > server.log 2>&1 || true
          kill "$MON" 2>/dev/null || true
          if [ $(( $(date +%s) - start )) -gt 600 ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save data to release
        if: always() && steps.restore.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar --zstd -cf "$ARCHIVE" -C data \
            --exclude='logs' --exclude='cache' --exclude='*.jar' --exclude='server.log' .
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "World data" \
              --notes "Automatic server data backup. Do not delete." --latest=false
          fi
          gh release upload "$TAG" "$ARCHIVE" --clobber

      - name: Add generated config files to repo
        if: always() && steps.restore.conclusion == 'success'
        run: |
          mkdir -p server
          rsync -am --ignore-existing \
            --include='server.properties' --include='bukkit.yml' \
            --include='spigot.yml' --include='commands.yml' \
            --include='ops.json' --include='whitelist.json' \
            --include='config/' --include='config/*.yml' \
            --include='plugins/' --include='plugins/*/' \
            --include='plugins/*/config.yml' \
            --exclude='*' data/ server/
          if [ -n "$(git status --porcelain server)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server
            git commit -m "Add generated server config files"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push || true
          fi

      - name: Queue next run
        if: ${{ !cancelled() && steps.srv.outputs.healthy == 'true' && vars.AUTO_RESTART != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mc-server.yml --repo "$GITHUB_REPOSITORY"

      - name: Discord final message
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_NUMBER: ${{ github.run_number }}
          HEALTHY: ${{ steps.srv.outputs.healthy }}
          JOB_STATUS: ${{ job.status }}
          AUTO_RESTART: ${{ vars.AUTO_RESTART }}
        run: bash scripts/status.sh final >/dev/null 2>&1 || true
