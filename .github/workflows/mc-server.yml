name: Minecraft Server

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: mc-server
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ vars.JAVA_VERSION || '25' }}

      - name: Restore data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: mc-data-${{ github.run_id }}
          restore-keys: mc-data-

      - name: Prepare server
        env:
          JAR_URL: ${{ vars.SERVER_JAR_URL }}
        run: |
          mkdir -p data
          curl -fsSL -o server.jar "$JAR_URL"
          if [ -d config ]; then cp -r config/. data/; fi
          echo "eula=true" > data/eula.txt

      - name: Start playit tunnel
        env:
          SECRET_KEY: ${{ secrets.PLAYIT_SECRET }}
        run: |
          docker run -d --name playit --net=host \
            -e SECRET_KEY="$SECRET_KEY" \
            ghcr.io/playit-cloud/playit-agent:1.0

      - name: Run server
        id: srv
        working-directory: data
        run: |
          start=$(date +%s)
          timeout -s TERM 335m java -Xms8G -Xmx10G -jar ../server.jar nogui > server.log 2>&1 || true
          if [ $(( $(date +%s) - start )) -gt 600 ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            !data/logs
            !data/cache
          key: mc-data-${{ github.run_id }}

      - name: Queue next run
        if: ${{ !cancelled() && steps.srv.outputs.healthy == 'true' && vars.AUTO_RESTART != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mc-server.yml --repo "$GITHUB_REPOSITORY"
